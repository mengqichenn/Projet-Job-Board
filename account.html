<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
    <link rel="stylesheet" type="text/css" href="style.css">

    <title></title>
</head>
<body>
    
    <header class="site-header">
        <div class="container">
            <a class="jobboard" href="main.html">job<span>board</span></a>
            <nav class="navbar">

                <!--header avec différents data-role-->

                <li><a href="main.html" aria-current="page">Offres</a></li>
                <li data-role="visiteur"><a class="btn btn-sm" href="login.html">Se connecter</a></li>
                <li data-role="visitor"><a class="btn btn-sm" href="account.html">S'inscrire</a></li>
                <li data-role="candidat" hidden><a href="candidat/dashboard.html">Mes candidatures</a></li>
                <li data-role="candidat entreprise admin" hidden><a href="profile.html">Mon compte</a></li>
                
                <li data-role="entreprise" hidden><a href="entreprise/dashboard.html">Mes offres</a></li>

                <li data-role="admin" hidden><a href="admin.html">Admin</a></li>
            </nav>
        </div>
    </header>



    <main>
        <section class="accountcontainer">
            <h1>Créer un compte</h1>

            <!-- choisir son role -->
            <fieldset class="role-choice" id="role-field">
                <legend>Je suis</legend>

                <!--par défaut on est candidat-->
                <label class="role-card">
                    <input type="radio" name="role" value="candidat" checked>
                    <span class="role-box"><strong>Candidat</strong></span>
                </label>

                <label class="role-card">
                    <input type="radio" name="role" value="entreprise">
                    <span class="role-box"><strong>Recruteur</strong></span>
                </label>
            </fieldset>


            <form class="accountform" id="account-form">
                <div class="form-row">
                    <div class="field"><label for="email">Adresse mail</label>
                        <input id="email" name="email" type="email" required></div>
                    <div class="field has-notice"><label for="mot_de_passe">Mot de passe</label>
                        <input class="input-password" id="mot_de_passe" name="mot_de_passe" type="password" autocomplete="new-password">
                        <p class="notice2">Votre mot de passe doit contenir au moins 12 caractères, et être composé de lettres et chiffres.</p></div>
                
                <!--formulaire d'inscription candidat (par défaut)-->

                <fieldset id="fs-candidat" style="border:0;padding:0;margin:0">
                    <div class="form-row">
                        <div class="field">
                            <label for="prenom">Prénom</label>
                            <input id="prenom" name="prenom">
                        </div>

                        <div class="field">
                            <label for="nom">Nom</label>
                            <input id="nom" name="nom"></div>

                        <div class="field">
                            <label for="telephone">Téléphone</label>
                            <input id="telephone" name="telephone" type="tel"></div>

                        <div class="field">
                            <label for="ville">Ville</label>
                            <input id="ville" name="ville"></div>
                    </div>
                        
                    <div class="field"><label for="cv">CV (pdf)</label><input id="cv" name="cv" type="file" accept=".pdf"</div>

                </fieldset>


                <!--formulaire d'inscription entreprise (caché)-->

                <fieldset id="fs-entreprise" style="border:0;padding:0;margin:0" hidden>
                    <div class="form-row">
                        <div class="field">
                            <label for="nom-entreprise">Nom de l'entreprise</label>
                            <input id="nom-entreprise" name="nom-entreprise"></div>
                        
                        <div class="field">
                            <label for="siret">Numéro SIRET</label>
                            <input id="siret" name="siret"></div>


                        <div class="field">
                            <label for="description">Description, activité</label>
                            <input id="description" name="description"></div>

                        <div class="field"><label for="website">Site web</label><input id="website" name="website" type="url"></div>

                        <div class="field">
                            <label for="ville">Ville</label>
                            <input id="ville" name="ville" type="text"></div>
                        
                    </div>

                </fieldset>
                <div style="display:flex;gap:.5rem;justify-content:space-between;flex-wrap:wrap">
                <button class="btn" type="submit" id="submit-btn">Créer mon compte</button>
                </div>
            </form>



        </section>

    </main>


    <script>

    </script>


</body>
</html>
