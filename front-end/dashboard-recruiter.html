<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icon.ico" type="image/x-icon">

    <title>Mes offres - Talentis</title>
</head>

<body class="recruiter-dashboard-page">
  <header class="site-header dashboard-header">
    <div class="container">
      <a class="jobboard" href="main.html"><span>Talentis</span></a>
      <nav aria-label="Navigation principale">
        <ul class="navbar">
          <li><a href="main.html">Offres</a></li>
          <li><a href="edit-profile.html">Modifier mon profil</a></li>
          <li class="menu" data-role="recruiter" hidden>
            <details>
              <summary class="menu-toggle" aria-label="Menu du compte">
                <span class="avatar menu-initials">TR</span><span class="menu-name">Mon compte</span>
              </summary>
              <div class="menu-panel">
                <a href="dashboard-recruiter.html">Mon dashboard</a>
                <a href="edit-profile.html">Modifier mon profil</a>
                <hr>
                <button type="button" data-logout>Déconnexion</button>
              </div>
            </details>
          </li>
        </ul>
      </nav>
    </div>
  </header>

    <main class="container dash-page">
        <h1>Mon espace recruteur</h1>
        <p class="muted">Publie tes offres et suis les candidatures reçues.</p>

        <section class="card" aria-label="Résumé">
            <div class="stats" id="stats"></div>
        </section>

        <!-- Mes offres -->
        <section class="card" aria-labelledby="t-offers">
            <div class="list-head">
                <h2 id="t-offers">Mes offres</h2>
                <button class="btn btn-sm" id="btn-new">Publier une offre</button>
            </div>
            <div class="list" id="offers"></div>
        </section>

        <!-- Candidatures reçues -->
        <section class="card" id="applicants-section" aria-labelledby="t-apps">
            <div class="list-head">
                <h2 id="t-apps">Candidatures reçues</h2>
                <div class="filter">
                    <label for="f-offer" class="muted">Offre</label>
                    <select id="f-offer"></select>
                    <label for="f-status" class="muted">Statut</label>
                    <select id="f-status">
                        <option value="all">Tous</option>
                        <option value="attente">En attente</option>
                        <option value="vue">Vue</option>
                        <option value="accepte">Acceptée</option>
                        <option value="refuse">Refusée</option>
                    </select>
                </div>
            </div>
            <div class="list" id="applicants"></div>
        </section>
    </main>

    <!-- Publier / modifier une offre -->
    <dialog id="dlg-offer">
        <form id="form-offer">
            <h2 id="offer-title">Publier une offre</h2>
            <div class="field">
                <label for="o-title">Titre du poste</label>
                <input id="o-title" required>
            </div>
            <div class="form-row two">
                <div class="field">
                    <label for="o-city">Ville</label>
                    <input id="o-city" required>
                </div>
                <div class="field">
                    <label for="o-contract">Type de contrat</label>
                    <select id="o-contract">
                        <option>CDI</option><option>CDD</option><option>Stage</option>
                        <option>Alternance</option><option>Intérim</option>
                    </select>
                </div>
            </div>
            <div class="field">
                <label for="o-desc">Description</label>
                <textarea id="o-desc" required></textarea>
            </div>
            <div class="actions-row">
                <button type="button" class="btn btn-ghost" id="offer-cancel">Annuler</button>
                <button type="submit" class="btn">Enregistrer</button>
            </div>
        </form>
    </dialog>

    <!-- Supprimer une offre -->
    <dialog id="dlg-del">
        <h2>Supprimer cette offre ?</h2>
        <p class="muted" id="del-text"></p>
        <div class="actions-row">
            <button class="btn btn-ghost" id="del-cancel">Garder</button>
            <button class="btn btn-danger" id="del-ok">Supprimer l'offre</button>
        </div>
    </dialog>

    <div id="toast" role="status" aria-live="polite"></div>

    <script src="js/api.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/dashboard-recruiter.js"></script>

</body>
</html>
