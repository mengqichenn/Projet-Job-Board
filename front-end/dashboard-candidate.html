<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icon.ico" type="image/x-icon">

    <title>Mes candidatures - Talentis</title>
</head>

<body class="candidate-dashboard-page">
  <header class="site-header dashboard-header">
    <div class="container">
      <a class="jobboard" href="main.html"><span>Talentis</span></a>
      <nav aria-label="Navigation principale">
        <ul class="navbar">
          <li><a href="main.html">Offres</a></li>
          <li><a href="edit-profile.html">Modifier mon profil</a></li>
          <li class="menu" data-role="candidate" hidden>
            <details>
              <summary class="menu-toggle" aria-label="Menu du compte">
                <span class="avatar menu-initials">TE</span><span class="menu-name">Mon compte</span>
              </summary>
              <div class="menu-panel">
                <a href="dashboard-candidate.html">Mon dashboard</a>
                <a href="edit-profile.html">Modifier mon profil</a>
                <hr>
                <button type="button" data-logout>Déconnexion</button>
              </div>
            </details>
          </li>
        </ul>
      </nav>
    </div>
  </header>

    <main class="container dash-page">
        <h1>Mes candidatures</h1>
        <p class="muted">Suis l'avancement des offres auxquelles tu as postulé.</p>

        <section class="card" aria-label="Résumé">
            <div class="stats" id="stats"></div>
        </section>

        <section class="card" aria-labelledby="t-apps">
            <div class="list-head">
                <h2 id="t-apps">Mes candidatures</h2>
                <div class="filter">
                    <label for="filter" class="muted">Statut</label>
                    <select id="filter">
                        <option value="all">Toutes</option>
                        <option value="attente">En attente</option>
                        <option value="vue">Vue par le recruteur</option>
                        <option value="accepte">Acceptées</option>
                        <option value="refuse">Refusées</option>
                    </select>
                </div>
            </div>
            <div class="list" id="list"></div>
        </section>
    </main>

    <!-- Modifier une candidature -->
    <dialog id="dlg-edit">
        <form id="form-edit">
            <h2 id="edit-title">Modifier ma candidature</h2>
            <div class="field">
                <label for="e-cv">CV (PDF, 5 Mo maximum)</label>
                <input type="file" id="e-cv" accept="application/pdf">
                <p class="notice" id="e-cv-current"></p>
                <p class="error" id="e-cv-error" role="alert"></p>
            </div>
            <div class="field">
                <label for="e-letter">Lettre de motivation</label>
                <textarea id="e-letter" required></textarea>
            </div>
            <div class="actions-row">
                <button type="button" class="btn btn-ghost" id="edit-cancel">Annuler</button>
                <button type="submit" class="btn">Enregistrer</button>
            </div>
        </form>
    </dialog>

    <!-- Retirer une candidature -->
    <dialog id="dlg-del">
        <h2>Retirer ma candidature ?</h2>
        <p class="muted" id="del-text"></p>
        <div class="actions-row">
            <button class="btn btn-ghost" id="del-cancel">Garder</button>
            <button class="btn btn-danger" id="del-ok">Retirer la candidature</button>
        </div>
    </dialog>

    <div id="toast" role="status" aria-live="polite"></div>

    <script src="js/api.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/dashboard-candidate.js"></script>
</body>
</html>
