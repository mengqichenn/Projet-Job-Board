<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="icon" href="icon.ico" type="image/x-icon">
    <title>Mes candidatures - Talentis</title>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="jobboard" href="main.html"><span>Talentis</span></a>
            <nav class="navbar">

                

                <li><a href="main.html" aria-current="page">Offres</a></li>

                <li data-role="visitor" hidden><a class="btn btn-sm" href="login.html">Se connecter</a></li>
                <li data-role="visitor" hidden><a class="btn btn-sm" href="account.html">S'inscrire</a></li>


                <!--Menu déroulant pour candidat-->
                <li class="menu" data-role="candidate" hidden>
                    <details>
                        <summary class="menu-toggle" aria-label="Menu du compte">
                            <span class="avatar menu-initials">MC</span><span class="menu-name">Mon compte</span>
                        </summary>
                        <div class="menu-panel">
                            <a class="menu-profile" href="account.html">
                                <span class="avatar menu-initials">MC</span>
                                <span><strong class="menu-name">Mon compte</strong><small>Voir mon compte</small></span>
                            </a>
                            <hr>
                            <a href="dashboard-candidate.html">Mon dashboard</a>
                            <hr>
                            <button type="button" data-logout>Déconnexion</button>
                        </div>
                    </details>
                </li>
                
                

                <li class="menu" data-role="recruiter" hidden>
                    <details>
                        <summary class="menu-toggle" aria-label="Menu du compte">
                            <span class="avatar menu-initials">MC</span><span class="menu-name">Mon compte</span>
                        </summary>

                        <div class="menu-panel">
                            <a class="menu-profile" href="account.html">
                                <span class="avatar menu-initials">MC</span>
                                <span><strong class="menu-name">Mon compte</strong><small>Voir mon compte</small></span>
                            </a>
                            <hr>
                            <a href="dashboard-recruiter.html">Mon dashboard</a>
                            <hr>
                            <button type="button" data-logout>Déconnexion</button>
                        </div>
                    </details>
                </li>
            </nav>
        </div>
    </header>
    

    <main class="container">
        <div class="results-header">
            <h2>Mes candidatures</h2>
        </div>
        <div class="ad-list"></div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/candidate.js"></script>
</body>
</html>
