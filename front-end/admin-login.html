<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
    <link rel="stylesheet" href="style/style.css">
    <link rel= "icon" href="style/icon.ico">
    <title>Connexion administrateur - Talentis</title>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="jobboard" href="main.html"><span>Talentis</span></a>
            <ul class="navbar">
               <li><a href="admin-login.html" aria-current="page">Espace admin</a></li>
            </ul>

        </div>
    </header>
    <main class="auth">
        <div class="card">
            <h1>Connexion</h1>

            <form id="login-form">
                <div class="field"><label for="email">Adresse mail</label>
                    <input id="email" type="email" name="email" autocomplete="email" required>
                </div>
                <div class="field"><label for="password">Mot de passe</label>
                    <input id="password" type="password" name="password" autocomplete="current-password" required>
                </div>
                <button class="btn" type="submit">Se connecter</button>
                <p class="notice"><a href="login.html">Retour à la connexion normale</a></p>
            </form>
        </div>

    </main>
<script src="js/admin-login.js"></script>
</body>

</html>
