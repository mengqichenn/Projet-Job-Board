<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
    <link rel="stylesheet" href="style.css">

    <title>Mes candidatures - JobBoard</title>
</head>

<body>
    <header class="site-header">
        <div class="container">
            <a class="jobboard" href="main.html">job<span>board</span></a>
            <nav class="navbar">

                <li><a href="main.html">Offres</a></li>
                <li class="dropdown" data-role="candidate">
                    <a href="dashboard-candidature.html" id="account-link" aria-current="page" aria-haspopup="true">Mon compte ▾</a>
                    <ul class="menu">
                        <li><a href="dashboard-candidature.html">Mes candidatures</a></li>
                        <li><a href="edit-profile.html">Modifier mon profil</a></li>
                        <li class="sep"></li>
                        <li><a class="logout" href="login.html" id="logout">Se déconnecter</a></li>
                    </ul>
                </li>

            </nav>
        </div>
    </header>

    <main class="container dash-page">
        <h1>Mes candidatures</h1>
        <p class="muted">Suis l'avancement des offres auxquelles tu as postulé.</p>

        <section class="card" aria-label="Résumé">
            <div class="stats" id="stats"></div>
        </section>

        <section class="card" aria-labelledby="t-apps">
            <div class="list-head">
                <h2 id="t-apps">Mes candidatures</h2>
                <div class="filter">
                    <label for="filter" class="muted">Statut</label>
                    <select id="filter">
                        <option value="all">Toutes</option>
                        <option value="attente">En attente</option>
                        <option value="vue">Vue par l'entreprise</option>
                        <option value="accepte">Acceptées</option>
                        <option value="refuse">Refusées</option>
                    </select>
                </div>
            </div>
            <div class="list" id="list"></div>
        </section>
    </main>

    <!-- Modifier une candidature -->
    <dialog id="dlg-edit">
        <form method="dialog" id="form-edit">
            <h2 id="edit-title">Modifier ma candidature</h2>
            <div class="field">
                <label for="e-cv">CV (PDF, DOC ou DOCX, 5 Mo maximum)</label>
                <input type="file" id="e-cv" accept=".pdf,.doc,.docx">
                <p class="notice" id="e-cv-current"></p>
                <p class="error" id="e-cv-error" role="alert"></p>
            </div>
            <div class="field">
                <label for="e-letter">Lettre de motivation</label>
                <textarea id="e-letter" required></textarea>
            </div>
            <div class="actions-row">
                <button type="button" class="btn btn-ghost" id="edit-cancel">Annuler</button>
                <button type="submit" class="btn">Enregistrer</button>
            </div>
        </form>
    </dialog>

    <!-- Retirer une candidature -->
    <dialog id="dlg-del">
        <h2>Retirer ma candidature ?</h2>
        <p class="muted" id="del-text"></p>
        <div class="actions-row">
            <button class="btn btn-ghost" id="del-cancel">Garder</button>
            <button class="btn btn-danger" id="del-ok">Retirer la candidature</button>
        </div>
    </dialog>

    <div id="toast" role="status" aria-live="polite"></div>

<script>
/* ------------------------------------------------------------------
   DONNÉES DE TEST (à remplacer par l'API Django plus tard)
   Exemple : await fetch(`http://127.0.0.1:8000/api/applications/${id}/`, {method:"DELETE"})
------------------------------------------------------------------- */
let applications = [
  { id: 1, title: "Développeur Python junior", company: "TechNova",  city: "Montpellier", date: "2026-10-01", status: "attente", cv: "cv_2026.pdf",   letter: "Bonjour, étudiant en informatique, je suis très intéressé par votre offre de développeur Python…" },
  { id: 2, title: "Stagiaire développeur web",  company: "WebAgency", city: "Paris",       date: "2026-09-28", status: "vue",     cv: "cv_2026.pdf",   letter: "Je souhaite rejoindre votre équipe pour approfondir mes compétences en HTML, CSS et Django…" },
  { id: 3, title: "Alternant DevOps",           company: "CloudSud",  city: "Toulouse",    date: "2026-09-20", status: "accepte", cv: "cv_devops.pdf", letter: "Passionné par Docker et l'automatisation, je candidate à votre alternance…" },
  { id: 4, title: "Data analyst junior",        company: "DataLab",   city: "Lyon",        date: "2026-09-12", status: "refuse",  cv: "cv_2026.pdf",   letter: "Votre offre correspond à mon projet professionnel…" }
];

/* PUT /api/applications/<id>/ : avec un fichier, on envoie un FormData (pas du JSON). Plus tard :
     const fd = new FormData(); fd.append("letter", data.letter); if (data.file) fd.append("cv", data.file);
     await fetch(`http://127.0.0.1:8000/api/applications/${id}/`, { method: "PUT", body: fd });          */
async function apiUpdateApplication(id, data){
  const { file, ...rest } = data;                  // en test, on garde seulement le nom du fichier
  Object.assign(applications.find(a => a.id === id), rest);
}
async function apiDeleteApplication(id){ applications = applications.filter(a => a.id !== id); }             // DELETE /api/applications/<id>/
/* ------------------------------------------------------------------ */

const STATUS = { attente:"En attente", vue:"Vue par l'entreprise", accepte:"Acceptée", refuse:"Refusée" };
const $ = id => document.getElementById(id);
let currentId = null;

function esc(s){ const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function fmt(d){ return new Date(d).toLocaleDateString("fr-FR", {day:"numeric", month:"long", year:"numeric"}); }
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); }

function renderStats(){
  const count = s => applications.filter(a => a.status === s).length;
  $("stats").innerHTML =
    `<div><strong>${applications.length}</strong><span class="muted">Candidatures</span></div>` +
    `<div><strong>${count("attente")}</strong><span class="muted">En attente</span></div>` +
    `<div><strong>${count("accepte")}</strong><span class="muted">Acceptées</span></div>`;
}

function renderList(){
  const f = $("filter").value;
  const items = applications.filter(a => f === "all" || a.status === f);
  if (!items.length){
    $("list").innerHTML = `<div class="empty">${applications.length
      ? "Aucune candidature avec ce statut."
      : 'Tu n\'as pas encore postulé. <a href="../main.html">Voir les offres</a>'}</div>`;
    return;
  }
  $("list").innerHTML = items.map(a => {
    const closed = a.status === "accepte" || a.status === "refuse";
    return `
    <article class="app">
      <div>
        <h3>${esc(a.title)}</h3>
        <div class="muted">${esc(a.company)}, ${esc(a.city)} · postulé le ${fmt(a.date)}</div>
        <span class="badge s-${a.status}">${STATUS[a.status]}</span>
      </div>
      <div class="actions">
        <button class="btn btn-sm btn-ghost" data-edit="${a.id}" ${closed ? 'disabled title="Candidature clôturée"' : ""}>Modifier</button>
        <button class="btn btn-sm btn-danger" data-del="${a.id}">Retirer</button>
      </div>
      <p class="letter">${esc(a.letter.length > 140 ? a.letter.slice(0,140) + "…" : a.letter)}</p>
    </article>`;
  }).join("");
}

function render(){ renderStats(); renderList(); }

$("list").addEventListener("click", e => {
  const edit = e.target.closest("[data-edit]"), del = e.target.closest("[data-del]");
  if (edit){
    const a = applications.find(x => x.id === +edit.dataset.edit);
    currentId = a.id;
    $("edit-title").textContent = "Modifier : " + a.title;
    $("e-cv").value = "";                                   // un champ fichier ne peut pas être pré-rempli
    $("e-cv-current").textContent = "CV actuel : " + a.cv + " (choisis un fichier pour le remplacer)";
    $("e-cv-error").textContent = "";
    $("e-letter").value = a.letter;
    $("dlg-edit").showModal();
  }
  if (del){
    const a = applications.find(x => x.id === +del.dataset.del);
    currentId = a.id;
    $("del-text").textContent = `Ta candidature pour « ${a.title} » chez ${a.company} sera supprimée.`;
    $("dlg-del").showModal();
  }
});

$("form-edit").addEventListener("submit", async e => {
  e.preventDefault();                                       // on ferme la fenêtre nous-mêmes, après vérification
  const file = $("e-cv").files[0];
  if (file){
    if (!/\.(pdf|docx?)$/i.test(file.name)) { $("e-cv-error").textContent = "Format non accepté. Choisis un fichier PDF, DOC ou DOCX."; return; }
    if (file.size > 5 * 1024 * 1024)        { $("e-cv-error").textContent = "Le fichier dépasse 5 Mo."; return; }
  }
  const a = applications.find(x => x.id === currentId);
  await apiUpdateApplication(currentId, { file: file || null, cv: file ? file.name : a.cv, letter: $("e-letter").value.trim() });
  $("dlg-edit").close(); render(); toast("Candidature modifiée");
});
$("edit-cancel").onclick = () => $("dlg-edit").close();

$("del-ok").onclick = async () => {
  await apiDeleteApplication(currentId);
  $("dlg-del").close(); render(); toast("Candidature retirée");
};
$("del-cancel").onclick = () => $("dlg-del").close();

$("filter").addEventListener("change", renderList);

/* Menu "Mon compte" sur téléphone (pas de survol) : un clic ouvre/ferme */
const dd = document.querySelector(".dropdown");
$("account-link").addEventListener("click", e => {
  if (window.matchMedia("(hover: none)").matches){ e.preventDefault(); dd.classList.toggle("open"); }
});
document.addEventListener("click", e => { if (!dd.contains(e.target)) dd.classList.remove("open"); });

/* Déconnexion : plus tard, vider le token ici avant la redirection */
$("logout").addEventListener("click", () => { /* localStorage.removeItem("token"); */ });

render();
</script>
</body>
</html>
